name: Android CI

# Runs when something in Mobile-App is pushed to main, on pull requests, or when started by hand.
on:
  push:
    branches: [ main ]
    paths:
      - 'Mobile-App/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Mobile-App/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The Android project lives in this folder, so every command runs from there.
    defaults:
      run:
        working-directory: Mobile-App/murendeni-android

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (keeps downloads for faster runs)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Saved even when a test fails, so the report can be read.
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: Mobile-App/murendeni-android/app/build/reports/tests/testDebugUnitTest/

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: murendeni-debug-apk
          path: Mobile-App/murendeni-android/app/build/outputs/apk/debug/app-debug.apk